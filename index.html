<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프리즘 디펜스</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --bg1: #ffe3f1;
    --bg2: #e0f2ff;
    --ink: #1f1640;
    --muted: #6b5f8f;
    --card: rgba(255,255,255,0.82);
    --grad: linear-gradient(135deg, #ff4fa3 0%, #ff8a3d 50%, #ffd23d 100%);
    --grad2: linear-gradient(135deg, #7c3aed 0%, #3b82f6 55%, #06d6c7 100%);
    --shadow: 0 10px 30px rgba(124, 58, 237, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color: var(--ink);
    background: radial-gradient(circle at 10% 10%, #ffd6ec 0, transparent 45%),
                radial-gradient(circle at 90% 20%, #c9e8ff 0, transparent 45%),
                radial-gradient(circle at 50% 100%, #fff1b8 0, transparent 50%),
                linear-gradient(160deg, var(--bg1), var(--bg2));
    padding: 16px;
    -webkit-user-select: none; user-select: none;
    word-break: keep-all; overflow-wrap: break-word;
  }
  .app { max-width: 1320px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 {
    margin: 0; font-size: clamp(22px, 3.2vw, 32px); font-weight: 900; letter-spacing: -0.02em;
    background: var(--grad2); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .stat {
    background: var(--card); border-radius: 14px; padding: 8px 14px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 8px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .stat svg { width: 18px; height: 18px; flex: none; }
  .stat small { color: var(--muted); font-weight: 600; font-size: 12px; }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 12px; align-items: start; }
  @media (max-width: 960px) {
    .main { grid-template-columns: minmax(0, 1fr); }
    .card.ctrl { order: -1; }
  }
  @media (max-width: 600px) {
    .overlay p { font-size: 13px; margin-bottom: 10px; }
    .overlay h2 { margin-bottom: 4px; font-size: 24px; }
    .overlay .long { display: none; }
    .overlay .btn { padding: 9px 14px; font-size: 14px; }
    #ovBest { margin-top: 6px !important; }
  }

  .board {
    position: relative; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow);
    background: var(--grad2); padding: 4px;
  }
  canvas#game { display: block; width: 100%; aspect-ratio: 16 / 10; border-radius: 14px; touch-action: none; cursor: crosshair; }

  .overlay {
    position: absolute; inset: 4px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 240, 250, 0.72); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    text-align: center; padding: 16px;
  }
  .overlay.hidden { display: none; }
  .overlay .box { max-width: 460px; }
  .overlay h2 {
    margin: 0 0 8px; font-size: clamp(26px, 5vw, 44px); font-weight: 900;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .overlay p { margin: 0 0 16px; color: var(--muted); line-height: 1.6; font-size: 15px; }
  .overlay .row { justify-content: center; flex-wrap: wrap; }
  .overlay .row > * { flex: 0 0 auto; }

  .panel { display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: var(--muted); font-weight: 800; letter-spacing: 0.02em; }

  .towers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  @media (max-width: 960px) { .towers { grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); } }
  .tbtn {
    position: relative;
    border: 2px solid transparent; border-radius: 12px; padding: 6px 2px 5px; background: #fff; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 1px; font: inherit; color: inherit; min-width: 0;
    transition: transform .12s, border-color .12s, box-shadow .12s;
  }
  .tbtn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(124,58,237,.18); }
  .tbtn.active { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124,58,237,.2); }
  .tbtn.poor { opacity: .45; }
  .tbtn canvas { width: 36px; height: 36px; }
  .tbtn b { font-size: 12px; white-space: nowrap; }
  .tbtn span { font-size: 11px; color: #c2410c; font-weight: 800; }
  .tbtn kbd {
    position: absolute; top: 3px; left: 5px; font-size: 10px; color: var(--muted); font-family: inherit; font-weight: 700;
    text-transform: uppercase;
  }

  .btn {
    border: 0; border-radius: 14px; padding: 12px 16px; font: inherit; font-weight: 800; font-size: 15px;
    color: #fff; background: var(--grad); cursor: pointer; box-shadow: 0 6px 18px rgba(255, 79, 163, .35);
    transition: transform .12s, filter .12s;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.7); opacity: .6; cursor: default; transform: none; }
  .btn.alt { background: var(--grad2); box-shadow: 0 6px 18px rgba(59, 130, 246, .3); }
  .btn.ghost { background: #fff; color: var(--ink); box-shadow: none; border: 2px solid #e6dcff; }
  .btn.ghost.on { border-color: #7c3aed; color: #7c3aed; background: #f3edff; }
  .btn.small { padding: 8px 10px; font-size: 13px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  .info { font-size: 14px; line-height: 1.55; min-height: 120px; }
  .info .name { font-weight: 900; font-size: 17px; }
  .info .desc { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-variant-numeric: tabular-nums; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-weight: 700; }
  .kv dd em { color: #16a34a; font-style: normal; }
  .info .row { margin-top: 10px; }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.6; }
  .wavebar { height: 8px; border-radius: 8px; background: #eee6ff; overflow: hidden; margin-top: 8px; }
  .wavebar i { display: block; height: 100%; width: 0; background: var(--grad); transition: width .2s; }
  .next { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 40px; }
  button { touch-action: manipulation; }
  .stat { transition: transform .12s; }
  .stat.bump { transform: scale(1.1); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>프리즘 디펜스</h1>
    <div class="stats">
      <div class="stat" title="코어 생명">
        <svg viewBox="0 0 24 24"><path fill="#ff4f7b" d="M12 21s-7.5-4.6-9.6-9.2C1 8.6 3 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5 19 5 21 8.6 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg>
        <span id="lives">0</span><small>생명</small>
      </div>
      <div class="stat" title="골드">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="#ffc22e"/><circle cx="12" cy="12" r="6" fill="none" stroke="#e08a00" stroke-width="2"/></svg>
        <span id="gold">0</span><small>골드</small>
      </div>
      <div class="stat" title="웨이브">
        <svg viewBox="0 0 24 24"><path fill="#7c3aed" d="M5 3h2v18H5zM8 4h11l-3 4 3 4H8z"/></svg>
        <span id="wave">0</span><small id="waveOf">웨이브</small>
      </div>
      <div class="stat" title="점수">
        <svg viewBox="0 0 24 24"><path fill="#06b6d4" d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>
        <span id="score">0</span><small>점수</small>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="board">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <div class="box">
          <h2 id="ovTitle">프리즘 디펜스</h2>
          <p id="ovText">길을 따라 몰려오는 적을 막아내세요.<span class="long"><br>타워 17종, 타워마다 5단계 강화. 지갑으로 돈을 벌고 코어 방어로 생명을 늘리세요.</span><br>웨이브는 끝없이 이어져요. 얼마나 오래 버티는지 도전!<span class="long"><br>후반부터 시작하면 15웨이브, 12000 골드로 바로 대군과 싸워요.<br>돈 무한 모드는 골드 무제한, 모든 타워가 설치하자마자 최대 강화예요.</span></p>
          <div class="row">
            <button class="btn" id="ovBtn">처음부터</button>
            <button class="btn" id="ovBtnLate">후반부터 시작</button>
            <button class="btn alt" id="ovBtnRich">돈 무한 모드</button>
          </div>
          <p class="hint" id="ovBest" style="margin-top:12px"></p>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="card">
        <h3>타워</h3>
        <div class="towers" id="towerList"></div>
      </div>
      <div class="card">
        <div class="info" id="info"></div>
      </div>
      <div class="card ctrl">
        <button class="btn" id="waveBtn" style="width:100%">웨이브 시작 (Space)</button>
        <div class="wavebar"><i id="waveProg"></i></div>
        <div class="next" id="nextInfo"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn ghost small" id="speedBtn">속도 1x</button>
          <button class="btn ghost small" id="autoBtn">자동 웨이브</button>
          <button class="btn ghost small" id="pauseBtn">일시정지</button>
        </div>
        <div class="row" style="margin-top:8px">
          <button class="btn ghost small" id="sfxBtn">효과음</button>
          <button class="btn ghost small" id="musicBtn">음악</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- 상수 / 맵 ----------
  const COLS = 16, ROWS = 10, T = 60, W = COLS * T, H = ROWS * T;
  const MAX_LV = 5;
  const WAYPOINTS = [[-1, 2], [3, 2], [3, 7], [7, 7], [7, 1], [11, 1], [11, 8], [14, 8], [14, 4], [16, 4]]
    .map(([c, r]) => ({ x: c * T + T / 2, y: r * T + T / 2 }));

  const pathCells = new Set();
  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    const a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
    const c0 = Math.floor(a.x / T), r0 = Math.floor(a.y / T), c1 = Math.floor(b.x / T), r1 = Math.floor(b.y / T);
    for (let c = Math.min(c0, c1); c <= Math.max(c0, c1); c++)
      for (let r = Math.min(r0, r1); r <= Math.max(r0, r1); r++)
        if (c >= 0 && c < COLS) pathCells.add(c + ',' + r);
  }
  const segLen = [], cum = [0];
  for (let i = 0; i < WAYPOINTS.length - 1; i++) {
    const a = WAYPOINTS[i], b = WAYPOINTS[i + 1];
    segLen.push(Math.hypot(b.x - a.x, b.y - a.y));
    cum.push(cum[i] + segLen[i]);
  }
  const PATH_LEN = cum[cum.length - 1];
  function posAt(d) {
    let i = 0;
    while (i < segLen.length - 1 && d > cum[i + 1]) i++;
    const a = WAYPOINTS[i], b = WAYPOINTS[i + 1], t = Math.min(1, Math.max(0, (d - cum[i]) / segLen[i]));
    return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t };
  }

  let seed = 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const decor = [];
  for (let c = 0; c < COLS; c++) for (let r = 0; r < ROWS; r++) {
    if (pathCells.has(c + ',' + r)) continue;
    if (rnd() < 0.35) decor.push({ x: c * T + 10 + rnd() * 40, y: r * T + 10 + rnd() * 40, k: rnd() < 0.6 ? 0 : 1, s: 0.6 + rnd() * 0.6, h: rnd() });
  }

  // ---------- 타워 정의 ----------
  // kind: bullet(투사체) beam(즉발) chain(연쇄) aura(지속 범위) missile(유도 다발) pulse(주기 범위) amp(버프) wallet(돈) core(생명)
  const TOWERS = {
    arrow:   { name: '화살탑',   key: '1', cost: 60,  color: '#10c98f', color2: '#7cf2c5', kind: 'bullet', range: 140, dmg: 16, rate: 0.4, speed: 600, desc: '싸고 빠른 단일 공격' },
    minigun: { name: '기관총',   key: '2', cost: 140, color: '#0fb5a5', color2: '#99f6e4', kind: 'bullet', range: 125, dmg: 7, rate: 0.1, speed: 800, desc: '초고속 연사' },
    cannon:  { name: '대포',     key: '3', cost: 150, color: '#ff7a1a', color2: '#ffc06b', kind: 'bullet', range: 125, dmg: 40, rate: 1.3, speed: 380, splash: 60, desc: '범위 폭발 피해' },
    frost:   { name: '냉기탑',   key: '4', cost: 110, color: '#2fb4ff', color2: '#a6e3ff', kind: 'bullet', range: 115, dmg: 6, rate: 0.8, speed: 450, splash: 50, slow: 0.5, slowTime: 1.6, desc: '범위 감속' },
    poison:  { name: '독탑',     key: '5', cost: 150, color: '#65c31a', color2: '#d9f99d', kind: 'bullet', range: 125, dmg: 4, rate: 0.9, speed: 420, splash: 45, poison: 16, desc: '중첩되는 독, 방어 무시 지속 피해' },
    laser:   { name: '레이저',   key: '6', cost: 200, color: '#e03bff', color2: '#f7a8ff', kind: 'beam', range: 230, dmg: 90, rate: 1.8, pierce: true, desc: '긴 사거리, 방어 무시' },
    sniper:  { name: '저격탑',   key: '7', cost: 280, color: '#ef3b4f', color2: '#ffb4bd', kind: 'beam', range: 420, dmg: 280, rate: 2.6, pierce: true, target: 'strong', desc: '맵 대부분 커버, 가장 강한 적 우선' },
    tesla:   { name: '번개탑',   key: '8', cost: 230, color: '#f5b400', color2: '#fff3a3', kind: 'chain', range: 140, dmg: 32, rate: 0.9, chain: 4, desc: '적 사이를 튀는 연쇄 번개' },
    flame:   { name: '화염탑',   key: '9', cost: 210, color: '#ff4d2e', color2: '#ffd08a', kind: 'aura', range: 90, dmg: 50, desc: '주변 모든 적을 계속 태움 (초당 피해)' },
    missile: { name: '미사일',   key: '0', cost: 320, color: '#5b5ff5', color2: '#c7c9ff', kind: 'missile', range: 230, dmg: 45, rate: 1.5, speed: 340, splash: 55, missiles: 3, desc: '여러 적에게 유도 미사일 다발' },
    execute: { name: '처형탑',   key: 'q', cost: 240, color: '#f08c00', color2: '#ffe0a3', kind: 'bullet', range: 150, dmg: 30, rate: 0.7, speed: 650, exec: 0.12, desc: '체력이 낮은 적 즉사 (보스 제외)' },
    vortex:  { name: '블랙홀',   key: 'w', cost: 260, color: '#8b46ff', color2: '#ddc8ff', kind: 'pulse', range: 120, dmg: 20, rate: 4.5, push: 55, desc: '주기적으로 적을 길 뒤로 끌어당김 (한 적당 3번까지)' },
    stasis:  { name: '시간정지', key: 'e', cost: 300, color: '#13c6e0', color2: '#b5f4ff', kind: 'pulse', range: 120, dmg: 0, rate: 6, freeze: 1.2, desc: '범위 안 적을 잠시 완전히 멈춤 (풀린 뒤 3초 면역)' },
    amp:     { name: '증폭탑',   key: 'r', cost: 250, color: '#ff3fa4', color2: '#ffc2e3', kind: 'amp', range: 110, amp: 0.2, desc: '주변 타워 공격력 증가 (중첩 안 됨)' },
    wallet:  { name: '지갑',     key: 't', cost: 180, color: '#e8a400', color2: '#ffe58a', kind: 'wallet', rate: 5, income: 14, desc: '웨이브 중 몇 초마다 골드 생산' },
    regen:   { name: '재생탑',   key: 'i', cost: 260, color: '#1fbf5f', color2: '#bbf7d0', kind: 'regen', rate: 12, heal: 1, desc: '웨이브 중 몇 초마다 생명 회복 (최대 생명까지)' },
    core:    { name: '코어 방어', key: 'y', cost: 220, color: '#ff4f7b', color2: '#ffc2d1', kind: 'core', life: 3, desc: '설치·강화할 때마다 최대 생명과 생명 +3 (판매하면 회수)' },
  };
  const upCost = (t) => Math.round(TOWERS[t.type].cost * 0.7 * t.lv);
  function stats(type, lv) {
    const d = TOWERS[type], k = lv - 1;
    return {
      dmg: Math.round((d.dmg || 0) * Math.pow(1.5, k)),
      range: Math.round((d.range || 0) * (1 + 0.07 * k)),
      rate: d.rate ? +(d.kind === 'wallet' ? d.rate : d.rate * (1 - 0.06 * k)).toFixed(2) : 0,
      splash: d.splash ? Math.round(d.splash * (1 + 0.08 * k)) : 0,
      slow: d.slow ? Math.max(0.2, d.slow - 0.07 * k) : 0, slowTime: d.slowTime || 0,
      poison: d.poison ? Math.round(d.poison * Math.pow(1.5, k)) : 0,
      chain: d.chain ? d.chain + k : 0,
      missiles: d.missiles ? d.missiles + Math.floor(k / 2) : 0,
      exec: d.exec ? +(d.exec + 0.03 * k).toFixed(2) : 0,
      push: d.push ? Math.round(d.push * (1 + 0.3 * k)) : 0,
      freeze: d.freeze ? +(d.freeze + 0.25 * k).toFixed(2) : 0,
      amp: d.amp ? +(d.amp + 0.1 * k).toFixed(2) : 0,
      income: d.income ? Math.round(d.income * Math.pow(1.45, k)) : 0,
      life: d.life ? d.life * lv : 0,
      heal: d.heal ? d.heal + Math.floor(k / 2) : 0,
    };
  }
  // 정보창 표시용
  const STAT_ROWS = [
    ['dmg', (d) => d.kind === 'aura' ? '초당 피해' : '공격력', (v) => v],
    ['range', () => '사거리', (v) => v],
    ['rate', (d) => d.kind === 'wallet' ? '생산 간격' : d.kind === 'regen' ? '회복 간격' : d.kind === 'pulse' ? '발동 간격' : '공격 간격', (v) => v + '초'],
    ['splash', () => '폭발 범위', (v) => v],
    ['slow', () => '감속', (v) => Math.round((1 - v) * 100) + '%'],
    ['poison', () => '독 (초당)', (v) => v],
    ['chain', () => '연쇄 수', (v) => v],
    ['missiles', () => '미사일 수', (v) => v],
    ['exec', () => '즉사 기준', (v) => Math.round(v * 100) + '% 이하'],
    ['push', () => '끌어당김', (v) => v],
    ['freeze', () => '정지 시간', (v) => v + '초'],
    ['amp', () => '공격력 증가', (v) => '+' + Math.round(v * 100) + '%'],
    ['income', () => '생산량', (v) => v + ' G'],
    ['life', () => '생명 보너스', (v) => '+' + v],
    ['heal', () => '회복량', (v) => '생명 +' + v],
  ];

  // ---------- 적 정의 ----------
  const ENEMIES = {
    grunt:  { name: '일반', hp: 60,   speed: 62,  reward: 5,   r: 12, color: '#ff4f7b', color2: '#ffb3c6', armor: 0,  lives: 1 },
    runner: { name: '돌격', hp: 36,   speed: 120, reward: 5,   r: 10, color: '#ffc21a', color2: '#fff0a8', armor: 0,  lives: 1 },
    swarm:  { name: '떼',   hp: 18,   speed: 88,  reward: 2,   r: 7,  color: '#24c7a0', color2: '#b6f5e2', armor: 0,  lives: 1 },

    for (let i = 0; i < count; i++) {

      let type = 'grunt';
      if (roll < 5) type = 'runner';
      else if (roll < 7 + Math.min(4, Math.floor(n / 8))) type = 'tank';
      list.push({ type, gap: type === 'runner' ? 0.1 : type === 'tank' ? 0.3 : 0.15 });

    const GAP = { minigun: 0.04, arrow: 0.05, cannon: 0.09, laser: 0.07, sniper: 0.06, tesla: 0.07, missile: 0.1, frost: 0.08, poison: 0.08, execute: 0.06 };

  // ---------- 로직 ----------
  const canAfford = (c) => S.infinite || S.gold >= c;
  const cellFree = (c, r) => c >= 0 && r >= 0 && c < COLS && r < ROWS && !pathCells.has(c + ',' + r) && !S.towers.some(t => t.c === c && t.r === r);

  function startWave() {

  function spawn(type) {

  const COMBO_MS = { 50: '50 콤보!', 100: '100 콤보! 대박', 200: '200 콤보! 학살', 300: '300 콤보! 폭주', 500: '500 콤보! 전설', 1000: '1000 콤보! 신' };
  const fmtN = (v) => v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e4 ? Math.round(v / 1e3) + 'k' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'k' : String(Math.max(1, Math.round(v)));
  function kill(e, label) {

    if (e.freezeT > 0) burst(e.x, e.y, '#b5f4ff', 8);
    if (S.coins.length < 40) S.coins.push({ sx: e.x, sy: e.y, cx: e.x + (Math.random() - 0.5) * 120, cy: e.y - 90 - Math.random() * 60, t: 0 });
    const ms = COMBO_MS[S.combo];

    if (e.type === 'boss') { Snd.play('bossdie'); S.shake = 0.45; ring(e.x, e.y, 90, '#ffd23d'); S.texts.push({ x: e.x, y: e.y - 40, txt: '보스 처치  +' + rw, life: 1.4, color: '#ff2a6d', big: true }); }

  function damage(e, amt, pierce, noFlash, crit) {

  function burst(x, y, color, n) {

      S.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.3 + Math.random() * 0.4, max: 0.7, color, r: 2 + Math.random() * 3 });

  }
  function ring(x, y, r, color, inward) { S.parts.push({ ring: true, x, y, r, life: 0.35, max: 0.35, color, inward }); }
  const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  function inRange(t, range) {
    const out = [];
    for (const e of S.enemies) { if (e.dead) continue; const rr = range + ENEMIES[e.type].r * 0.5; if (dist2(e, t) <= rr * rr) out.push(e); }

  function placeTower(type, c, r) {

    S.texts.push({ x: t.x, y: t.y, txt: '+' + v, life: 1, color: '#b45309' });

  }

  function fire(t, d, st, targets) {
    const crit = Math.random() < 0.12;
    const dmg = st.dmg * t.buff * (crit ? 2.5 : 1);
    const muzzle = () => { if (S.parts.length < 900) S.parts.push({ flash: true, vx: 0, vy: 0, x: t.x + Math.cos(t.angle) * 24, y: t.y + Math.sin(t.angle) * 24, r: t.type === 'cannon' ? 14 : 9, life: 0.08, max: 0.08, color: '#fff6b0' }); };
    const first = targets.reduce((a, b) => (b.d > a.d ? b : a));
    const aim = (e) => { t.angle = Math.atan2(e.y - t.y, e.x - t.x); };
    switch (d.kind) {
      case 'bullet': {
        aim(first);
        S.bullets.push({ x: t.x + Math.cos(t.angle) * 20, y: t.y + Math.sin(t.angle) * 20, tx: first.x, ty: first.y, target: first, speed: d.speed,
          dmg, splash: st.splash, slow: st.slow, slowTime: st.slowTime, poison: st.poison * t.buff, exec: st.exec, type: t.type, color: d.color, crit });

          for (const e of targets) if (e.freezeT <= 0 && e.freezeImm <= 0) { e.freezeT = e.type === 'boss' ? st.freeze * 0.5 : st.freeze; e.freezeImm = e.freezeT + 3; }
          ring(t.x, t.y, st.range, d.color); Snd.play('stasis');

    }
  }

  let uiDirty = false;
  function update(dt) {
    S.t += dt;
    if (S.waveActive && S.spawnQ.length) {
      S.spawnT -= dt;
      while (S.spawnT <= 0 && S.spawnQ.length) { const s = S.spawnQ.shift(); spawn(s.type); S.spawnT += s.gap; }
    }

      if (e.poisonT > 0) { e.poisonT -= dt; damage(e, e.poisonDps * dt, true, true); if (e.poisonT <= 0) e.poisonDps = 0; if (e.dead) continue; }

      if (Math.abs(p.x - e.x) + Math.abs(p.y - e.y) > 0.01) e.dir = Math.atan2(p.y - e.y, p.x - e.x);
      e.x = p.x; e.y = p.y;
      if (e.d >= PATH_LEN) {
        e.dead = true; S.waveDone++;
        S.lives -= ENEMIES[e.type].lives; S.leaked += ENEMIES[e.type].lives; Snd.play('leak');
        flashT = 0.35; S.combo = 0;

        uiDirty = true;
      }
    }
    S.enemies = S.enemies.filter(e => !e.dead);

    // 증폭 버프 계산
    for (const t of S.towers) t.buff = 1;
    for (const a of S.towers) {
      if (a.type !== 'amp') continue;

      const d = TOWERS[t.type], st = stats(t.type, t.lv);
      t.cd -= dt; t.flash = Math.max(0, t.flash - dt * 4);
      if (d.kind === 'amp' || d.kind === 'core') continue;
      if (d.kind === 'regen') {
        if (!S.waveActive) { t.cd = Math.max(t.cd, 0.5); continue; }
        if (t.cd <= 0 && S.lives < S.maxLives) {
          t.cd = st.rate; t.flash = 1;
          S.lives = Math.min(S.maxLives, S.lives + st.heal); Snd.play('regen');
          S.texts.push({ x: t.x, y: t.y - 24, txt: '생명 +' + st.heal, life: 1, color: '#16a34a' });
          ring(t.x, t.y, 28, '#1fbf5f'); burst(t.x, t.y, '#86efac', 6); uiDirty = true;
        }
        continue;
      }
      if (d.kind === 'wallet') {
        if (!S.waveActive) { t.cd = Math.max(t.cd, 0.5); continue; }
        if (t.cd <= 0) {
          t.cd = st.rate; t.flash = 1;
          const inc = st.income;
          S.gold += inc; S.score += inc * 2; Snd.play('wallet');
          S.texts.push({ x: t.x, y: t.y - 24, txt: '+' + inc + ' G', life: 1, color: '#b45309' });
          burst(t.x, t.y - 10, '#ffd23d', 6); uiDirty = true;
        }
        continue;
      }
      const targets = inRange(t, st.range);
      if (!targets.length) continue;
      if (d.kind === 'aura') {
        t.tick -= dt;
        const dmg = st.dmg * t.buff * dt;
        for (const e of targets) damage(e, dmg, true, true);
        if (t.tick <= 0) {
          t.tick = 0.05; Snd.play('flame');
          const e = targets[(Math.random() * targets.length) | 0];
          const a = Math.atan2(e.y - t.y, e.x - t.x) + (Math.random() - 0.5) * 0.5, s = 140 + Math.random() * 80;
          if (S.parts.length < 900) S.parts.push({ x: t.x, y: t.y - 6, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.45, max: 0.45, color: Math.random() < 0.5 ? '#ff7a1a' : '#ffd23d', r: 4 + Math.random() * 3, grow: true });
        }
        continue;
      }
      if (d.kind === 'bullet' || d.kind === 'beam' || d.kind === 'missile') {
        const first = targets.reduce((a, b) => (b.d > a.d ? b : a));
        const want = Math.atan2(first.y - t.y, first.x - t.x);
        const diff = ((want - t.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
        t.angle += diff * Math.min(1, dt * 14);
      }
      if (t.cd <= 0) { t.cd = st.rate; t.flash = 1; fire(t, d, st, targets); Snd.play('shot', t.type); }
    }

    for (const b of S.bullets) {
      if (b.target && !b.target.dead) { b.tx = b.target.x; b.ty = b.target.y; }
      const dx = b.tx - b.x, dy = b.ty - b.y, dist = Math.hypot(dx, dy) || 0.001;
      let arrived;
      if (b.homing) {
        const k = Math.min(1, dt * 5);
        b.vx += (dx / dist * b.speed - b.vx) * k; b.vy += (dy / dist * b.speed - b.vy) * k;
        b.x += b.vx * dt; b.y += b.vy * dt; b.a = Math.atan2(b.vy, b.vx);
        b.life = (b.life || 0) + dt;
        arrived = dist < 14 || b.life > 3;
        if (Math.random() < 0.5 && S.parts.length < 900) S.parts.push({ x: b.x, y: b.y, vx: 0, vy: 0, life: 0.25, max: 0.25, color: '#ffd23d', r: 3 });
      } else {
        const step = b.speed * dt;
        arrived = dist <= step + 4;
        if (!arrived) { b.x += dx / dist * step; b.y += dy / dist * step; b.a = Math.atan2(dy, dx); }
      }
      if (!arrived) continue;
      b.done = true;
      if (b.splash) {
        const hits = [];
        for (const e of S.enemies) {
          if (e.dead) continue;
          const rr = b.splash + ENEMIES[e.type].r;
          if ((e.x - b.tx) ** 2 + (e.y - b.ty) ** 2 <= rr * rr) hits.push(e);
        }
        for (const e of hits) {
          damage(e, b.dmg, false, false, b.crit);
          if (b.slow && !e.dead) { e.slowF = Math.min(e.slowF, e.type === 'boss' ? 1 - (1 - b.slow) * 0.5 : b.slow); e.slowT = b.slowTime; }
          if (b.poison && !e.dead) { e.poisonDps = Math.min(e.poisonDps + b.poison, b.poison * 5); e.poisonT = 4; }
        }
        ring(b.tx, b.ty, b.splash, b.color);
        if ((b.type === 'cannon' || b.type === 'missile') && S.parts.length < 900) Snd.play('boom'), S.parts.push({ boom: true, vx: 0, vy: 0, x: b.tx, y: b.ty, r: b.splash, life: 0.28, max: 0.28 });
        burst(b.tx, b.ty, b.color, b.type === 'cannon' || b.type === 'missile' ? 10 : 4);
      } else if (b.target && !b.target.dead) {
        const e = b.target;
        damage(e, b.dmg, false, false, b.crit);
        if (b.exec && !e.dead && e.type !== 'boss' && e.hp / e.maxHp <= b.exec) { kill(e, '처형'); Snd.play('exec'); }
        burst(b.tx, b.ty, b.color, 2);
      }
    }
    S.bullets = S.bullets.filter(b => !b.done);
    S.enemies = S.enemies.filter(e => !e.dead);

    for (const p of S.parts) { p.life -= dt; if (!p.ring) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; } }
    S.parts = S.parts.filter(p => p.life > 0);
    for (const n of S.nums) { n.life -= dt; n.y -= 45 * dt; n.x += n.vx * dt; }
    S.nums = S.nums.filter(n => n.life > 0);
    for (const c of S.coins) { c.t += dt * 1.6; if (c.t >= 1 && !c.done) { c.done = true; bumpGold(); Snd.play('coin'); } }
    S.coins = S.coins.filter(c => !c.done);
    for (const t of S.texts) { t.life -= dt; t.y -= (t.pop ? 10 : 30) * dt; }
    S.texts = S.texts.filter(t => t.life > 0);
    for (const b of S.beams) b.life -= dt;
    S.beams = S.beams.filter(b => b.life > 0);

    if (S.waveActive && !S.spawnQ.length && !S.enemies.length && !S.over) {
      S.waveActive = false;
      const bonus = 60 + S.wave * 12;
      S.gold += bonus; S.score += S.wave * 150;
      Snd.play('clear');
      S.texts.push({ x: W / 2, y: H / 2, txt: `웨이브 ${S.wave} 클리어  +${bonus} 골드`, life: 1.8, color: '#7c3aed', big: true });
      if (S.auto) S.autoT = 1.5;
      uiDirty = true;
    }
    if (S.auto && !S.waveActive && S.autoT > 0) { S.autoT -= dt; if (S.autoT <= 0) startWave(); }
  }

  let flashT = 0;
  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (S.shake > 0) { const m = S.shake * 14; ctx.translate((Math.random() - 0.5) * m, (Math.random() - 0.5) * m); }
    ctx.drawImage(bgLayer, 0, 0);

    const s0 = WAYPOINTS[1];
    ctx.fillStyle = 'rgba(255, 79, 163, 0.85)';
    const pulse = 4 + Math.sin(S.t * 5) * 3;
    ctx.beginPath(); ctx.moveTo(6 + pulse, s0.y - 14); ctx.lineTo(26 + pulse, s0.y); ctx.lineTo(6 + pulse, s0.y + 14); ctx.closePath(); ctx.fill();

    if (S.selTower) {
      const st = stats(S.selTower.type, S.selTower.lv);
      if (st.range) rangeCircle(S.selTower.x, S.selTower.y, st.range, 'rgba(124,58,237,0.14)', 'rgba(124,58,237,0.8)');
      if (S.selTower.type === 'amp') {
        ctx.strokeStyle = 'rgba(255,63,164,0.8)'; ctx.lineWidth = 2;
        for (const t of S.towers) if (t !== S.selTower && dist2(t, S.selTower) <= st.range * st.range) { ctx.beginPath(); ctx.moveTo(S.selTower.x, S.selTower.y); ctx.lineTo(t.x, t.y); ctx.stroke(); }
      }
    }
    if (S.selType && S.hover) {
      const { c, r } = S.hover, x = c * T + T / 2, y = r * T + T / 2;
      const ok = cellFree(c, r) && canAfford(TOWERS[S.selType].cost);
      ctx.fillStyle = ok ? 'rgba(255,255,255,0.45)' : 'rgba(255,59,92,0.35)';
      roundRect(ctx, c * T + 3, r * T + 3, T - 6, T - 6, 10); ctx.fill();
      const rg = stats(S.selType, 1).range;
      if (rg) rangeCircle(x, y, rg, ok ? 'rgba(255,255,255,0.18)' : 'rgba(255,59,92,0.12)', ok ? 'rgba(255,255,255,0.9)' : 'rgba(255,59,92,0.8)');
      ctx.globalAlpha = 0.65; drawTower(ctx, S.selType, x, y, 1, 0, 1, 0, S.t); ctx.globalAlpha = 1;
    }

    for (const t of sorted) {
      drawTower(ctx, t.type, t.x, t.y, t.lv, t.angle, 1, t.flash, S.t);
      if (t.buff > 1) { ctx.fillStyle = '#ff3fa4'; ctx.beginPath(); ctx.arc(t.x + 18, t.y + 18, 4, 0, 7); ctx.fill(); }
    }

    for (const e of S.enemies) drawEnemy(ctx, e);

    for (const b of S.bullets) {
      ctx.save(); ctx.translate(b.x, b.y);
      switch (b.type) {
        case 'arrow': ctx.rotate(b.a || 0); ctx.fillStyle = '#065f46'; ctx.fillRect(-8, -1.5, 14, 3); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(4, -4); ctx.lineTo(4, 4); ctx.fill(); break;
        case 'minigun': ctx.rotate(b.a || 0); ctx.fillStyle = '#ffd23d'; ctx.fillRect(-5, -1.5, 10, 3); break;
        case 'cannon': ctx.fillStyle = '#3b1d0a'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.fillStyle = '#ffb36b'; ctx.beginPath(); ctx.arc(-2, -2, 2, 0, 7); ctx.fill(); break;
        case 'poison': ctx.fillStyle = '#a3e635'; ctx.strokeStyle = '#3f6212'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.stroke(); break;
        case 'execute': ctx.rotate(b.a || 0); ctx.fillStyle = '#f08c00'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-6, -4); ctx.lineTo(-6, 4); ctx.fill(); break;
        case 'missile': ctx.rotate(b.a || 0); ctx.fillStyle = '#5b5ff5'; roundRect(ctx, -7, -3, 14, 6, 3); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(4, -2, 3, 4); break;
        default: ctx.fillStyle = '#e0f6ff'; ctx.strokeStyle = '#2fb4ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill(); ctx.stroke();
      }
      ctx.restore();
    }
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const b of S.beams) {
      const a = b.life / b.max;
      ctx.globalAlpha = a;
      ctx.beginPath();
      const p = b.pts;
      ctx.moveTo(p[0], p[1]);
      for (let i = 2; i < p.length; i += 2) {
        if (b.zap) {
          const px = p[i - 2], py = p[i - 1], qx = p[i], qy = p[i + 1];
          for (let k = 1; k < 4; k++) { const f = k / 4; ctx.lineTo(px + (qx - px) * f + (Math.random() - 0.5) * 14, py + (qy - py) * f + (Math.random() - 0.5) * 14); }
        }
        ctx.lineTo(p[i], p[i + 1]);
      }
      ctx.strokeStyle = b.color; ctx.globalAlpha = a * 0.3; ctx.lineWidth = b.w * 3.5; ctx.stroke(); ctx.globalAlpha = a;
      ctx.strokeStyle = b.color; ctx.lineWidth = b.w * (b.zap ? 1.6 : a); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, b.w * 0.4 * a); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    for (const p of S.parts) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      if (p.boom) {
        const k = 1 - a, rr = p.r * (0.4 + k * 0.9);
        const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
        gr.addColorStop(0, 'rgba(255,255,255,0.95)'); gr.addColorStop(0.35, 'rgba(255,214,90,0.85)'); gr.addColorStop(0.7, 'rgba(255,110,40,0.5)'); gr.addColorStop(1, 'rgba(255,80,40,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.fill();
      } else if (p.flash) {
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.6 + a * 0.6), 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.45, 0, 7); ctx.fill();
      } else if (p.ring) {
        ctx.strokeStyle = p.color; ctx.lineWidth = 4;
        const rr = p.inward ? p.r * a : p.r * (1.2 - a * 0.4);
        ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(1, rr), 0, 7); ctx.stroke();
      } else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.grow ? p.r * (1.6 - a) : p.r, 0, 7); ctx.fill(); }
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const n of S.nums) {
      const pop = 1 + Math.max(0, n.life - (n.max - 0.12)) * (n.crit ? 8 : 4);
      ctx.globalAlpha = Math.min(1, n.life * 3);
      ctx.save(); ctx.translate(n.x, n.y); ctx.scale(pop, pop);
      ctx.font = `900 ${n.crit ? 22 : 13}px Pretendard, -apple-system, sans-serif`;
      ctx.lineWidth = n.crit ? 5 : 3; ctx.strokeStyle = n.crit ? '#c2410c' : '#1f1640'; ctx.strokeText(n.txt, 0, 0);
      ctx.fillStyle = n.crit ? '#ffd23d' : '#ffffff'; ctx.fillText(n.txt, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    for (const c of S.coins) {
      const k = c.t * c.t, u = 1 - k, tx = W - 40, ty = 16;
      const x = u * u * c.sx + 2 * u * k * c.cx + k * k * tx, y = u * u * c.sy + 2 * u * k * c.cy + k * k * ty;
      ctx.fillStyle = '#ffc22e'; ctx.strokeStyle = '#e08a00'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.ellipse(x, y, 6 * Math.abs(Math.cos(c.t * 12)) + 1.5, 6, 0, 0, 7); ctx.fill(); ctx.stroke();
    }
    for (const t of S.texts) {
      ctx.globalAlpha = Math.min(1, t.life * 2);
      if (t.pop) { const k = 1 + Math.max(0, t.life - 1.35) * 4; ctx.save(); ctx.translate(t.x, t.y); ctx.scale(k * 1.4, k * 1.4); ctx.font = '900 30px Pretendard, sans-serif'; ctx.lineWidth = 7; ctx.strokeStyle = '#fff'; ctx.strokeText(t.txt, 0, 0); ctx.fillStyle = t.color; ctx.fillText(t.txt, 0, 0); ctx.restore(); continue; }
      ctx.font = `${t.big ? 900 : 800} ${t.big ? 30 : 15}px Pretendard, -apple-system, sans-serif`;
      ctx.lineWidth = t.big ? 6 : 4; ctx.strokeStyle = '#fff'; ctx.strokeText(t.txt, t.x, t.y);
      ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
    }
    ctx.globalAlpha = 1;

    if (S.combo >= 10) {
      const sz = Math.min(52, 24 + S.combo / 6);
      const pop = 1 + Math.max(0, S.comboT - 1.3) * 1.5;
      ctx.save(); ctx.translate(W / 2, 34); ctx.scale(pop, pop);
      ctx.font = `900 ${sz}px Pretendard, sans-serif`;
      const gr = ctx.createLinearGradient(-120, 0, 120, 0);
      gr.addColorStop(0, '#ff4fa3'); gr.addColorStop(0.5, '#ff8a3d'); gr.addColorStop(1, '#ffd23d');
      ctx.lineWidth = 7; ctx.strokeStyle = '#fff'; ctx.strokeText(`${S.combo} 콤보`, 0, 0);
      ctx.fillStyle = gr; ctx.fillText(`${S.combo} 콤보`, 0, 0);
      ctx.restore();
    }

    if (flashT > 0) { ctx.fillStyle = `rgba(255, 59, 92, ${flashT * 0.5})`; ctx.fillRect(0, 0, W, H); }
    if (S.paused && S.started && !S.over) {
      ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.fillRect(0, 0, W, H);
      ctx.font = '900 48px Pretendard, sans-serif'; ctx.fillStyle = '#7c3aed'; ctx.fillText('일시정지', W / 2, H / 2);
    }
  }
  function rangeCircle(x, y, r, fill, stroke) {
    ctx.fillStyle = fill; ctx.strokeStyle = stroke; ctx.lineWidth = 2; ctx.setLineDash([8, 6]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
  }

  // ---------- 루프 ----------
  let last = performance.now(), uiT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    flashT = Math.max(0, flashT - dt);
    if (S.started && !S.paused && !S.over) {
      for (let i = 0; i < S.speed && !S.over; i++) update(dt);
    } else S.t += dt;
    render();
    uiT -= dt;
    if (uiDirty && uiT <= 0) { uiDirty = false; uiT = 0.1; updateUI(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 입력 ----------
  function cellFromEvent(ev) {
    const rect = cv.getBoundingClientRect();
    const x = (ev.clientX - rect.left) / rect.width * W, y = (ev.clientY - rect.top) / rect.height * H;
    return { c: Math.floor(x / T), r: Math.floor(y / T) };
  }
  // 드래그로 지나간 칸마다 설치
  let drag = null;
  function tryPlace(c, r) {
    if (!S.selType || !cellFree(c, r)) return;
    const d = TOWERS[S.selType];
    if (!canAfford(d.cost)) {
      if (!drag || !drag.warned) Snd.play('deny');
      if (!drag || !drag.warned) S.texts.push({ x: c * T + T / 2, y: r * T + 10, txt: '골드 부족', life: 0.9, color: '#ff3b5c' });
      if (drag) drag.warned = true;
      return;
    }
    placeTower(S.selType, c, r);
  }
  function canvasPos(ev) {
    const rect = cv.getBoundingClientRect();
    return { x: (ev.clientX - rect.left) / rect.width * W, y: (ev.clientY - rect.top) / rect.height * H };
  }
  cv.addEventListener('pointermove', ev => {
    S.hover = cellFromEvent(ev);
    if (!drag) return;
    const p = canvasPos(ev), dx = p.x - drag.x, dy = p.y - drag.y, steps = Math.ceil(Math.hypot(dx, dy) / (T / 3));
    for (let i = 1; i <= steps; i++) tryPlace(Math.floor((drag.x + dx * i / steps) / T), Math.floor((drag.y + dy * i / steps) / T));
    drag.x = p.x; drag.y = p.y;
    uiDirty = true;
  });
  cv.addEventListener('pointerleave', () => { if (!drag) S.hover = null; });
  const endDrag = () => {
    if (!drag) return;
    drag = null;
    if (S.selType && !canAfford(TOWERS[S.selType].cost)) S.selType = null;
    updateUI();
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', endDrag);
  cv.addEventListener('pointerdown', ev => {
    if (!S.started || S.over || ev.button === 2) return;
    const { c, r } = cellFromEvent(ev);
    S.hover = { c, r };
    const t = S.towers.find(t => t.c === c && t.r === r);
    if (t) { S.selTower = t; S.selType = null; updateUI(); return; }
    if (S.selType) {
      drag = { ...canvasPos(ev), warned: false };
      try { cv.setPointerCapture(ev.pointerId); } catch (e) {}
      tryPlace(c, r);
      updateUI();
      return;
    }
    S.selTower = null; updateUI();
  });
  cv.addEventListener('contextmenu', ev => { ev.preventDefault(); S.selType = null; S.selTower = null; updateUI(); });

  window.addEventListener('keydown', ev => {
    if (ev.code === 'Space') { ev.preventDefault(); if (!S.started) begin('normal'); else startWave(); return; }
    if (ev.key === 'Escape') { S.selType = null; S.selTower = null; updateUI(); return; }
    const k = ev.key.toLowerCase();
    if (k === 'm') { const on = !(Snd.sfx || Snd.music); Snd.set('sfx', on); Snd.set('music', on); updateUI(); return; }
    if (k === 'p') { togglePause(); return; }
    if (S.selTower && k === 'u') { upgradeTower(S.selTower); updateUI(); return; }
    if (S.selTower && k === 's') { sellTower(S.selTower); updateUI(); return; }
    for (const id in TOWERS) if (TOWERS[id].key === k) { selectType(id); return; }
  });

  // ---------- UI ----------
  const $ = id => document.getElementById(id);
  const btns = {};
  for (const k in TOWERS) {
    const d = TOWERS[k];
    const b = document.createElement('button');
    b.className = 'tbtn'; b.title = d.name + ' - ' + d.desc;
    const ic = document.createElement('canvas'); ic.width = 80; ic.height = 80;
    const g = ic.getContext('2d'); g.scale(2, 2); drawTower(g, k, 20, 22, 0, -Math.PI / 4, 0.75);
    b.append(ic);
    b.insertAdjacentHTML('beforeend', `<b>${d.name}</b><span>${d.cost} G</span><kbd>${d.key}</kbd>`);
    b.onclick = () => selectType(k);
    $('towerList').append(b); btns[k] = b;
  }
  function selectType(k) {
    if (!S.started || S.over) return;
    S.selType = S.selType === k ? null : k; S.selTower = null; updateUI();
  }
  function togglePause() { if (!S.started || S.over) return; S.paused = !S.paused; updateUI(); }

  $('waveBtn').onclick = startWave;
  $('speedBtn').onclick = () => { S.speed = S.speed >= 4 ? 1 : S.speed + 1; updateUI(); };
  $('autoBtn').onclick = () => { S.auto = !S.auto; if (S.auto && !S.waveActive && S.started) S.autoT = 0.5; updateUI(); };
  $('pauseBtn').onclick = togglePause;
  $('sfxBtn').onclick = () => { Snd.set('sfx', !Snd.sfx); if (Snd.sfx) Snd.play('coin'); updateUI(); };
  $('musicBtn').onclick = () => { Snd.set('music', !Snd.music); updateUI(); };
  // 브라우저 자동재생 정책: 첫 클릭/키 입력 때 오디오를 켠다
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => Snd.init(), { capture: true }));

  function describeNext() {
    const list = buildWave(S.wave + 1), cnt = {};
    for (const s of list) cnt[s.type] = (cnt[s.type] || 0) + 1;
    return `다음: 총 ${list.length}마리 · ` + Object.entries(cnt).map(([k, v]) => `${ENEMIES[k].name} ${v}`).join(' · ');
  }
  function statRows(type, lv) {
    const d = TOWERS[type], st = stats(type, lv), nx = lv < MAX_LV ? stats(type, lv + 1) : null;
    return STAT_ROWS.filter(([k]) => st[k]).map(([k, label, fmt]) => {
      const up = nx && nx[k] !== st[k] ? ` <em>→ ${fmt(nx[k])}</em>` : '';
      return `<dt>${label(d)}</dt><dd>${fmt(st[k])}${up}</dd>`;
    }).join('');
  }

  const setText = (id, v) => { const el = $(id); if (el.textContent !== String(v)) el.textContent = v; };
  let lastInfo = '';
  let bumpT = 0;
  function bumpGold() {
    const now = performance.now(); if (now - bumpT < 120) return; bumpT = now;
    const el = $('gold').parentElement; el.classList.add('bump'); setTimeout(() => el.classList.remove('bump'), 110);
  }
  function updateUI() {
    setText('lives', `${S.lives} / ${S.maxLives}`); setText('gold', S.infinite ? '무한' : S.gold.toLocaleString()); setText('wave', S.wave);
    setText('score', S.score.toLocaleString());
    for (const k in btns) { btns[k].classList.toggle('active', S.selType === k); btns[k].classList.toggle('poor', !canAfford(TOWERS[k].cost)); }
    const wb = $('waveBtn');
    wb.disabled = !S.started || S.waveActive || S.over;
    setText('waveBtn', S.over ? '게임 종료' : S.waveActive ? `웨이브 ${S.wave} 진행 중` : `웨이브 ${S.wave + 1} 시작 (Space)`);
    $('waveProg').style.width = S.waveActive ? `${(S.waveDone / S.waveTotal) * 100}%` : '0%';
    setText('nextInfo', S.waveActive ? `남은 적 ${S.waveTotal - S.waveDone} / ${S.waveTotal}` : describeNext());
    setText('speedBtn', `속도 ${S.speed}x`);
    $('autoBtn').classList.toggle('on', S.auto);
    setText('autoBtn', S.auto ? '자동 켜짐' : '자동 웨이브');
    setText('pauseBtn', S.paused ? '계속하기' : '일시정지');
    setText('sfxBtn', Snd.sfx ? '효과음 켜짐' : '효과음 꺼짐'); $('sfxBtn').classList.toggle('on', Snd.sfx);
    setText('musicBtn', Snd.music ? '음악 켜짐' : '음악 꺼짐'); $('musicBtn').classList.toggle('on', Snd.music);

    const info = $('info');
    let html;
    if (S.selTower) {
      const t = S.selTower, d = TOWERS[t.type], canUp = t.lv < MAX_LV;
      const sellTxt = d.kind === 'core' ? `판매 ${Math.floor(t.spent * 0.7)} G · 생명 -${stats(t.type, t.lv).life}` : `판매 ${Math.floor(t.spent * 0.7)} G (S)`;
      html = `<div class="name">${d.name} <small style="color:#b45309">Lv.${t.lv}${t.lv >= MAX_LV ? ' MAX' : ''}</small>${t.buff > 1 ? ` <small style="color:#ff3fa4">증폭 +${Math.round((t.buff - 1) * 100)}%</small>` : ''}</div>
        <div class="desc">${d.desc}</div>
        <dl class="kv">${statRows(t.type, t.lv)}</dl>
        <div class="row">
          <button class="btn alt small" id="upBtn" ${!canUp || !canAfford(upCost(t)) ? 'disabled' : ''}>${canUp ? `강화 ${upCost(t)} G (U)` : '최대 레벨'}</button>
          <button class="btn ghost small" id="sellBtn">${sellTxt}</button>
        </div>`;
    } else if (S.selType) {
      const d = TOWERS[S.selType];
      html = `<div class="name">${d.name} <small style="color:#c2410c">${d.cost} G</small></div><div class="desc">${d.desc}</div>
        <dl class="kv">${statRows(S.selType, 1).replace(/ <em>.*?<\/em>/g, '')}</dl>
        <p class="hint" style="margin:8px 0 0">빈 땅을 눌러 설치, 누른 채로 드래그하면 지나간 칸마다 연속 설치. 우클릭·Esc로 취소.</p>`;
    } else {
      html = `<div class="name">작전 안내</div>
        <p class="hint" style="margin:6px 0 0">타워를 고른 뒤 길이 아닌 칸을 누르거나 드래그해서 설치하세요. 설치된 타워를 누르면 강화(U, 최대 5단계)·판매(S).<br>
        지갑은 웨이브 중에 돈을, 재생탑은 생명을 벌고, 증폭탑은 주변 타워를 강하게 해요. 5웨이브마다 보스!<br>
        단축키: 1~0, Q~I 타워 · Space 웨이브 · P 일시정지 · M 소리</p>`;
    }
    if (html !== lastInfo) { info.innerHTML = html; lastInfo = html; }
  }
  // 정보창 버튼은 위임으로 처리 (다시 그려져도 클릭이 안전)
  $('info').addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b || !S.selTower) return;
    if (b.id === 'upBtn') upgradeTower(S.selTower); else if (b.id === 'sellBtn') sellTower(S.selTower);
    updateUI();
  });

  // 모드별 최고 웨이브 기록
  const MODE_NAME = { normal: '처음부터', late: '후반부터', rich: '돈 무한' };
  function loadBest(mode) { try { return +localStorage.getItem('prism-td-wave-' + mode) || 0; } catch (e) { return 0; } }
  function saveBest(mode, v) { try { if (v > loadBest(mode)) localStorage.setItem('prism-td-wave-' + mode, v); } catch (e) {} }
  function bestText() {
    const parts = Object.keys(MODE_NAME).filter(m => loadBest(m)).map(m => `${MODE_NAME[m]} ${loadBest(m)}웨이브`);
    return parts.length ? '최고 기록 · ' + parts.join(' · ') : '';
  }

  function begin(mode) {
    reset(mode || (S && S.mode) || 'normal'); S.started = true;
    $('overlay').classList.add('hidden');
    updateUI();
  }
  function gameOver() {
    Snd.play('over');
    S.over = true; S.selType = null; S.waveActive = false;
    const prev = loadBest(S.mode);
    saveBest(S.mode, S.wave);
    $('ovTitle').textContent = '게임 오버';
    $('ovText').innerHTML = `${MODE_NAME[S.mode]} 모드, 웨이브 <b>${S.wave}</b>에서 방어선이 무너졌어요.${S.wave > prev ? ' <b style="color:#ff4fa3">최고 기록 갱신!</b>' : ''}<br>점수 <b>${S.score.toLocaleString()}</b> · 최고 콤보 ${S.bestCombo}`;
    $('ovBtn').textContent = '처음부터';
    $('ovBest').textContent = bestText();
    $('overlay').classList.remove('hidden');
    updateUI();
  }
  $('ovBtn').onclick = () => begin('normal');
  $('ovBtnLate').onclick = () => begin('late');
  $('ovBtnRich').onclick = () => begin('rich');
  $('ovBest').textContent = bestText();
  updateUI();

  // 테스트/디버그용 훅
  window.__td = {
    S: () => S, Snd, begin, startWave, placeTower, upgradeTower, sellTower, upCost, stats, TOWERS, ENEMIES, pathCells,
    setHpScale: (f) => { hpScale = f; },
  };
})();
</script>
</body>
</html>
